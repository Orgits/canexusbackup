version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: ca-nexus-postgres-test
    environment:
      POSTGRES_USER: ca_nexus
      POSTGRES_PASSWORD: ca_nexus_dev_password
      POSTGRES_DB: ca_nexus_test
    ports:
      - "5432:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ca_nexus"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7
    container_name: ca-nexus-redis-test
    ports:
      - "6379:6379"
    volumes:
      - redis_test_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./FastAPI Backend
      dockerfile: Dockerfile.test
    container_name: ca-nexus-backend-test
    environment:
      - TEST_DATABASE_URL=postgresql+asyncpg://ca_nexus:ca_nexus_dev_password@postgres:5432/ca_nexus_test
      - REDIS_URL=redis://redis:6379/3
      - CELERY_BROKER_URL=redis://redis:6379/4
      - CELERY_RESULT_BACKEND=redis://redis:6379/5
      - SECRET_KEY=test-secret-key-for-testing-only-minimum-32-chars-long
      - ENCRYPTION_KEY=dGVzdC1lbmNyeXB0aW9uLWtleS10aGlydHktdHdvLWJ5dGVzLQ==
      - ENVIRONMENT=testing
      - DEBUG=true
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing"

  celery-worker:
    build:
      context: ./FastAPI Backend
      dockerfile: Dockerfile.test
    container_name: ca-nexus-celery-worker-test
    environment:
      - TEST_DATABASE_URL=postgresql+asyncpg://ca_nexus:ca_nexus_dev_password@postgres:5432/ca_nexus_test
      - REDIS_URL=redis://redis:6379/3
      - CELERY_BROKER_URL=redis://redis:6379/4
      - CELERY_RESULT_BACKEND=redis://redis:6379/5
      - SECRET_KEY=test-secret-key-for-testing-only-minimum-32-chars-long
      - ENCRYPTION_KEY=dGVzdC1lbmNyeXB0aW9uLWtleS10aGlydHktdHdvLWJ5dGVzLQ==
      - ENVIRONMENT=testing
      - DEBUG=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.core.celery.app worker --loglevel=info --queues=default,compliance,notifications,workload,outbox

  celery-beat:
    build:
      context: ./FastAPI Backend
      dockerfile: Dockerfile.test
    container_name: ca-nexus-celery-beat-test
    environment:
      - TEST_DATABASE_URL=postgresql+asyncpg://ca_nexus:ca_nexus_dev_password@postgres:5432/ca_nexus_test
      - REDIS_URL=redis://redis:6379/3
      - CELERY_BROKER_URL=redis://redis:6379/4
      - CELERY_RESULT_BACKEND=redis://redis:6379/5
      - SECRET_KEY=test-secret-key-for-testing-only-minimum-32-chars-long
      - ENCRYPTION_KEY=dGVzdC1lbmNyeXB0aW9uLWtleS10aGlydHktdHdvLWJ5dGVzLQ==
      - ENVIRONMENT=testing
      - DEBUG=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.core.celery.app beat --loglevel=info --schedule=/tmp/celerybeat-schedule

volumes:
  postgres_test_data:
  redis_test_data: