global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'ca-nexus'
    environment: 'development'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # CA Nexus API
  - job_name: 'ca-nexus-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # PostgreSQL exporter (if available)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    metrics_path: '/metrics'

  # Redis exporter (if available)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    metrics_path: '/metrics'

  # Celery workers
  - job_name: 'celery-workers'
    static_configs:
      - targets: ['worker-compliance:8000', 'worker-notifications:8000', 'worker-workload:8000', 'worker-outbox:8000']
    metrics_path: '/metrics'
    scrape_interval: 30s