[project]
name = "ca-nexus-api"
version = "0.1.0"
description = "CA Nexus Backend API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "pydantic-extra-types>=2.4.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "httpx>=0.26.0",
    "redis>=5.0.1",
    "celery>=5.3.6",
    "email-validator>=2.1.0",
    "python-dateutil>=2.8.2",
    "uuid6>=1.10.0",
    "argon2-cffi>=23.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "faker>=22.0.0",
    "ruff>=0.1.15",
    "mypy>=1.7.1",
    "pre-commit>=3.6.0",
]
test = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "faker>=22.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
select = ["E", "F", "I", "UP", "W", "B", "C4", "ARG", "SIM", "TID", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "NPY", "RSE", "RET", "ASYNC", "DTZ", "TCH", "INT", "LOG", "PERF", "PIE", "QL", "RUF", "SLF", "SLOT", "T10", "FA", "ISC", "ICN", "PD", "PGH", "PL", "TRY", "NPY", "RSE", "RET", "ASYNC", "DTZ", "TCH", "INT", "LOG", "PERF", "PIE", "QL", "RUF", "SLF", "SLOT", "T10", "FA", "ISC", "ICN"]
ignore = ["E501", "B008", "ARG001", "ARG002", "SIM103", "T201", "T203", "PTH118", "PTH123", "S101", "PLW0108", "PERF401"]
exclude = ["migrations", ".venv", "dist", "build"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["migrations", ".venv", "dist", "build"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["migrations*", "tests*"]