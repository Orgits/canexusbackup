name: CA Nexus Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.13"
  POSTGRES_VERSION: "16"
  REDIS_VERSION: "7"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          cd "FastAPI Backend"
          pip install -e ".[dev]"

      - name: Run Ruff linting
        run: |
          cd "FastAPI Backend"
          ruff check .

      - name: Run Ruff format check
        run: |
          cd "FastAPI Backend"
          ruff format --check .

      - name: Run MyPy type checking
        run: |
          cd "FastAPI Backend"
          mypy app/

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ env.POSTGRES_VERSION }}
        env:
          POSTGRES_USER: ca_nexus
          POSTGRES_PASSWORD: ca_nexus_dev_password
          POSTGRES_DB: ca_nexus_test
        ports: 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:${{ env.REDIS_VERSION }}
        ports: 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          cd "FastAPI Backend"
          pip install -e ".[dev,test]"

      - name: Wait for PostgreSQL
        run: |
          sleep 5
          pg_isready -h localhost -p 5432 -U ca_nexus

      - name: Wait for Redis
        run: |
          redis-cli -h localhost -p 6379 ping

      - name: Run unit tests
        run: |
          cd "FastAPI Backend"
          pytest tests/unit -v --tb=short -x --timeout=60
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://ca_nexus:ca_nexus_dev_password@localhost:5432/ca_nexus_test
          REDIS_URL: redis://localhost:6379/3

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ env.POSTGRES_VERSION }}
        env:
          POSTGRES_USER: ca_nexus
          POSTGRES_PASSWORD: ca_nexus_dev_password
          POSTGRES_DB: ca_nexus_test
        ports: 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:${{ env.REDIS_VERSION }}
        ports: 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          cd "FastAPI Backend"
          pip install -e ".[dev,test]"

      - name: Wait for PostgreSQL
        run: |
          sleep 5
          pg_isready -h localhost -p 5432 -U ca_nexus

      - name: Wait for Redis
        run: |
          redis-cli -h localhost -p 6379 ping

      - name: Run integration tests
        run: |
          cd "FastAPI Backend"
          pytest tests/integration -v --tb=short -x --timeout=120
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://ca_nexus:ca_nexus_dev_password@localhost:5432/ca_nexus_test
          REDIS_URL: redis://localhost:6379/3

  test-api:
    name: API Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ env.POSTGRES_VERSION }}
        env:
          POSTGRES_USER: ca_nexus
          POSTGRES_PASSWORD: ca_nexus_dev_password
          POSTGRES_DB: ca_nexus_test
        ports: 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:${{ env.REDIS_VERSION }}
        ports: 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          cd "FastAPI Backend"
          pip install -e ".[dev,test]"

      - name: Wait for PostgreSQL
        run: |
          sleep 5
          pg_isready -h localhost -p 5432 -U ca_nexus

      - name: Wait for Redis
        run: |
          redis-cli -h localhost -p 6379 ping

      - name: Run API tests
        run: |
          cd "FastAPI Backend"
          pytest tests/api -v --tb=short -x --timeout=120
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://ca_nexus:ca_nexus_dev_password@localhost:5432/ca_nexus_test
          REDIS_URL: redis://localhost:6379/3

  test-migration:
    name: Migration Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ env.POSTGRES_VERSION }}
        env:
          POSTGRES_USER: ca_nexus
          POSTGRES_PASSWORD: ca_nexus_dev_password
          POSTGRES_DB: ca_nexus_migration_test
        ports: 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          cd "FastAPI Backend"
          pip install -e ".[dev]"

      - name: Wait for PostgreSQL
        run: |
          sleep 5
          pg_isready -h localhost -p 5432 -U ca_nexus

      - name: Run migration from empty database
        run: |
          cd "FastAPI Backend"
          alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://ca_nexus:ca_nexus_dev_password@localhost:5432/ca_nexus_migration_test

      - name: Verify migration
        run: |
          cd "FastAPI Backend"
          alembic current
          alembic history
        env:
          DATABASE_URL: postgresql+asyncpg://ca_nexus:ca_nexus_dev_password@localhost:5432/ca_nexus_migration_test

  test-coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ env.POSTGRES_VERSION }}
        env:
          POSTGRES_USER: ca_nexus
          POSTGRES_PASSWORD: ca_nexus_dev_password
          POSTGRES_DB: ca_nexus_test
        ports: 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:${{ env.REDIS_VERSION }}
        ports: 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          cd "FastAPI Backend"
          pip install -e ".[dev,test]"

      - name: Wait for PostgreSQL
        run: |
          sleep 5
          pg_isready -h localhost -p 5432 -U ca_nexus

      - name: Wait for Redis
        run: |
          redis-cli -h localhost -p 6379 ping

      - name: Run tests with coverage
        run: |
          cd "FastAPI Backend"
          pytest tests/ --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=70 --timeout=120
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://ca_nexus:ca_nexus_dev_password@localhost:5432/ca_nexus_test
          REDIS_URL: redis://localhost:6379/3

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./FastAPI Backend/coverage.xml
          flags: unittests
          name: codecov-umbrella

  build:
    name: Build & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          cd "FastAPI Backend"
          pip install -e ".[dev]"

      - name: Check for security vulnerabilities
        run: |
          cd "FastAPI Backend"
          pip install safety
          safety check --json

      - name: Check for outdated dependencies
        run: |
          cd "FastAPI Backend"
          pip list --outdated --format=json || true

  deploy-staging:
    name: Deploy to Staging
    needs: [lint, test-unit, test-integration, test-api, test-migration, test-coverage, build]
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying to staging..."
          # Add your staging deployment commands here
          # e.g., docker build, docker push, kubectl apply, etc.

  deploy-production:
    name: Deploy to Production
    needs: [lint, test-unit, test-integration, test-api, test-migration, test-coverage, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          # Add your production deployment commands here
          # e.g., docker build, docker push, kubectl apply, etc.